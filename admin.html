<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Full Control</title>
<style>
body{font-family:Arial;padding:15px;background:#f5f5f5}
.card{background:white;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 5px #0001}
input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.green{background:#22c55e;color:white;width:100%}
.black{background:#111827;color:white;width:100%;margin-top:10px}
label{font-weight:bold;font-size:14px}
</style>
</head>
<body>

<h2>🚗 Dealership Full Admin <button onclick="localStorage.clear();location.reload()" style="float:right;background:#ef4444;color:white;padding:6px 12px;border-radius:6px;">Logout</button></h2>

<div class="card">
<h3>🏢 Profile & Contact</h3>
<label>Dealership Name</label><input id="bizName" value="Affordable Used Cars For Sale">
<label>Tagline</label><input id="tagline" value="Best Prices Always Open - Clean Title">
<label>Logo / Profile Photo (Upload)</label><input type="file" id="logoFile" accept="image/*"><input id="logoUrl" placeholder="Logo URL">
<label>Cover / Banner Photo (Upload)</label><input type="file" id="coverFile" accept="image/*"><input id="coverUrl" placeholder="Cover URL">
<label>Email</label><input id="email" value="affordableusedcarsatlanta2019@gmail.com">
<label>Phone / WhatsApp</label><input id="phone" value="+1 (740) 530-7194">
<label>Location</label><input id="location" value="Atlanta, GA">
<label>Hours</label><input id="hours" value="Always Open">
<label>Facebook Link</label><input id="fbLink" value="https://tinyurl.com/yh9n6497">
<label>About Us</label><textarea id="about">Quality affordable used cars with clean titles. Financing available.</textarea>
</div>

<div class="card">
<h3>➕ Add / Edit Car</h3>
<label>Year</label><input id="year" placeholder="e.g. 2019">
<label>Make Model</label><input id="makeModel" placeholder="e.g. Kia Rio S Sedan 4D">
<label>Price</label><input id="price" placeholder="e.g. $2,800">
<label>Mileage</label><input id="mileage" placeholder="e.g. 136,000">
<label>Color</label><input id="color" placeholder="e.g. White">
<label>Car Photo - Upload from Phone</label><input type="file" id="carFile" accept="image/*"><input id="imageUrl" placeholder="Image URL auto-fills">
<div id="preview"></div>
<label>Features</label><input id="features" placeholder="Cold AC, Backup Camera">
<button class="green" onclick="addCar()">+ Add Car</button>
<table border="1" style="width:100%;margin-top:10px;border-collapse:collapse"><thead><tr><th>Car</th><th>Price</th><th>Action</th></tr></thead><tbody id="carList"></tbody></table>
</div>

<div class="card">
<button class="black" onclick="generateCode()">⚙️ Generate New index.html Code (with Profile + Cars)</button>
<textarea id="outputCode" style="height:200px;display:none;"></textarea>
<p style="background:#fef3c7;padding:10px;border-radius:8px;"><b>How to update live site:</b><br>1. Tap Generate<br>2. Copy code<br>3. Go to GitHub → index.html → Edit → Paste → Commit<br>4. Wait 2 mins - Done!</p>
</div>

<script>
// File upload to base64
function toBase64(fileInput, urlInput, previewId){
 fileInput.addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=ev=>{
   urlInput.value=ev.target.result;
   if(previewId) document.getElementById(previewId).innerHTML='<img src="'+ev.target.result+'" style="width:100%;border-radius:10px">';
  }; r.readAsDataURL(f);
 });
}
toBase64(document.getElementById('logoFile'), document.getElementById('logoUrl'));
toBase64(document.getElementById('coverFile'), document.getElementById('coverUrl'));
toBase64(document.getElementById('carFile'), document.getElementById('imageUrl'), 'preview');

let cars = JSON.parse(localStorage.getItem('cars')||'[]');
function addCar(){
 const c={year:year.value, makeModel:makeModel.value, price:price.value, mileage:mileage.value, color:color.value, imageUrl:imageUrl.value, features:features.value};
 cars.push(c); localStorage.setItem('cars', JSON.stringify(cars)); render();
}
function render(){
 carList.innerHTML=''; cars.forEach((c,i)=>{
  carList.innerHTML+=`<tr><td>${c.year} ${c.makeModel}</td><td>${c.price}</td><td><button onclick="cars.splice(${i},1);localStorage.setItem('cars',JSON.stringify(cars));render()">Delete</button></td></tr>`;
 });
}
render();
function generateCode(){
 // This generates full index.html with your profile edits + cars
 let carsHtml = cars.map(c=>`
 <div class="car"><img src="${c.imageUrl}"><h3>${c.year} ${c.makeModel}</h3><p>${c.price} | ${c.mileage} miles | ${c.color}</p><p>${c.features}</p><a href="https://wa.me/${document.getElementById('phone').value.replace(/[^0-9]/g,'')}?text=Hi, I'm interested in ${c.year} ${c.makeModel}">WhatsApp</a></div>`).join('');
 const full = `<!DOCTYPE html><html><head><title>${bizName.value}</title></head><body>
 <div style="background:url('${coverUrl.value}');height:200px;background-size:cover"></div>
 <img src="${logoUrl.value}" style="width:100px;border-radius:50%;margin-top:-50px">
 <h1>${bizName.value}</h1><p>${tagline.value}</p><p>${location.value} | ${hours.value}</p><p>${email.value} | ${phone.value}</p><p>${about.value}</p>
 <div>${carsHtml}</div></body></html>`;
 outputCode.style.display='block'; outputCode.value=full;
}
// Load saved profile
['bizName','tagline','logoUrl','coverUrl','email','phone','location','hours','fbLink','about'].forEach(id=>{
 const v=localStorage.getItem(id); if(v) document.getElementById(id).value=v;
 document.getElementById(id).addEventListener('input', e=>localStorage.setItem(id, e.target.value));
});
</script>
</body>
</html>
